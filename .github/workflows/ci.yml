name: CI

on:
  push:
    branches: [main]
  # Every pull request, whatever its base. Filtering on `branches: [main]`
  # here would filter on the *base* branch, skipping pull requests that
  # target another branch.
  pull_request:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-node@v6
        with:
          node-version: '24'
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Build
        run: npm run build

      - name: Key derivation test
        run: npm test

# The browser suite (`npm run test:e2e`) is deliberately not run here. It
# creates spaces on a real PWS server with a registration code and has the
# batch issuer API send an email, so it runs against the local dev server or
# the deployed site (see README).
